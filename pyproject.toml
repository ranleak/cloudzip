[project]
name = "cloudzip"
version = "1.0.0"
description = "Modal.com FastAPI cloud service for universal archive manipulation and GPU-accelerated ZIP conversion powered by NVIDIA nvCOMP."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Alexander Scott" },
]
requires-python = ">=3.11"
keywords = [
    "archive",
    "zip",
    "compression",
    "nvcomp",
    "cuda",
    "gpu",
    "modal",
    "fastapi",
    "deflate",
    "zstandard",
]
dependencies = [
    "brotli>=1.1.0",
    "cramjam>=2.8.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "libarchive-c>=5.1",
    "lz4>=4.3.0",
    "modal>=1.1.0",
    "numpy>=2.0.0",
    "nvidia-nvcomp-cu12>=5.0.0; sys_platform == 'linux'",
    "py7zr>=0.22.0",
    "pycryptodomex>=3.20.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.12",
    "pyzipper>=0.3.6",
    "rarfile>=4.2",
    "uvicorn[standard]>=0.32.0",
    "zstandard>=0.23.0",
]

[project.scripts]
cloudzip-api = "cloudzip.api:run_local"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudzip"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
